<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de apoio a projetos sociais, voluntariado e inclusão digital."
    />
    <title>ConectaAção | Plataforma do Terceiro Setor</title>
  </head>
  <body>
    <a class="skip-link" href="#conteudo-principal"
      >Ir para o conteúdo principal</a
    >

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#/" aria-label="ConectaAção - Página inicial">
          <span class="brand-mark" aria-hidden="true">CA</span>
          <span>ConectaAção</span>
        </a>

        <button
          id="menu-toggle"
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="menu-principal"
          aria-label="Abrir menu de navegação"
        >
          <span aria-hidden="true">☰</span>
        </button>

        <nav
          id="menu-principal"
          class="main-nav"
          aria-label="Navegação principal"
        >
          <a href="#/" data-route="/">Início</a>
          <a href="#/projetos" data-route="/projetos">Projetos</a>
          <a href="#/voluntariado" data-route="/voluntariado">Voluntariado</a>
        </nav>

        <button
          id="contrast-toggle"
          class="contrast-toggle"
          type="button"
          aria-pressed="false"
        >
          Alto contraste
        </button>
      </div>
    </header>

    <main id="conteudo-principal" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <strong>ConectaAção</strong>
          <p>Projeto acadêmico de Front-End voltado ao terceiro setor.</p>
        </div>
        <div>
          <strong>Acessibilidade</strong>
          <p>
            Interface com navegação por teclado, HTML semântico e alto
            contraste.
          </p>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
